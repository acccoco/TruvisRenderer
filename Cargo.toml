[workspace]
resolver = "3"
members = [
    # tools
    "engine/tools/truvis-fetch-res",
    "engine/tools/truvis-shader-binding-codegen",
    "engine/tools/truvis-shader-build",
    "engine/tools/truvis-cxx-binding-build",
    # runtime foundation
    "engine/runtime/e00-foundation/truvis-utils",
    "engine/runtime/e00-foundation/truvis-logs",
    "engine/runtime/e00-foundation/truvis-path",
    "engine/runtime/e00-foundation/truvis-shader-manifest",
    # runtime gfx
    "engine/runtime/e10-gfx/truvis-gfx",
    "engine/runtime/e10-gfx/truvis-descriptor-layout-macro",
    "engine/runtime/e10-gfx/truvis-descriptor-layout-trait",
    # runtime render
    "engine/runtime/e40-render/truvis-render-foundation",
    "engine/runtime/e40-render/truvis-render-graph",
    "engine/runtime/e40-render/truvis-render-runtime",
    # runtime world
    "engine/runtime/e30-world/truvis-asset",
    "engine/runtime/e30-world/truvis-world",
    # runtime render loop
    "engine/runtime/e50-render-loop/truvis-render-loop",
    # runtime platform
    "engine/runtime/e60-platform/truvis-render-thread",
    "engine/runtime/e60-platform/truvis-winit-host",
    # shader 绑定相关
    "engine/shader/truvis-shader-binding",
    # cxx 绑定相关
    "cxx/bindings/truvis-assimp-binding",
    "cxx/bindings/truvis-streamline-binding",
    "cxx/bindings/truvis-vk-binding",
    # renderer
    "renderer/truvis-renderer",
    "renderer/editor/truvis-editor-bridge",
    "renderer/renderer-kit",
    "renderer/renderer-imgui",
    "renderer/renderer-dlss",
    "renderer/renderer-render-passes",
    "renderer/renderer-rendering",
    "renderer/renderer-render-ui",
    "renderer/samples/triangle-renderer",
    "renderer/samples/shader-toy-renderer",
    # app
    "renderer/shader/truvis-renderer-shader-binding",
    "app/truvis-app",
    "app/truvis-scenes",
    "app/samples/triangle-app",
    "app/samples/shader-toy-app",
    "app/samples/cornell-app",
]

[profile.dev]
opt-level = 0      # 优化级别: 0-3。0 表示不优化，编译最快
debug = true       # 包含调试符号
incremental = true # 开启增量编译，提升二次编译速度

[profile.release]
opt-level = 3      # 最高级优化，运行速度最快
debug = false      # 移除调试符号，减小二进制体积
lto = true         # 开启链接时优化 (Link Time Optimization)
panic = 'abort'    # panic 时直接终止，进一步减小体积


[workspace.dependencies]
# tools
truvis-fetch-res = { path = "engine/tools/truvis-fetch-res" }
truvis-shader-binding-codegen = { path = "engine/tools/truvis-shader-binding-codegen" }
truvis-shader-build = { path = "engine/tools/truvis-shader-build" }
truvis-cxx-binding-build = { path = "engine/tools/truvis-cxx-binding-build" }
# runtime foundation
truvis-logs = { path = "engine/runtime/e00-foundation/truvis-logs" }
truvis-utils = { path = "engine/runtime/e00-foundation/truvis-utils" }
truvis-path = { path = "engine/runtime/e00-foundation/truvis-path" }
truvis-shader-manifest = { path = "engine/runtime/e00-foundation/truvis-shader-manifest" }
# runtime gfx
truvis-gfx = { path = "engine/runtime/e10-gfx/truvis-gfx" }
truvis-descriptor-layout-macro = { path = "engine/runtime/e10-gfx/truvis-descriptor-layout-macro" }
truvis-descriptor-layout-trait = { path = "engine/runtime/e10-gfx/truvis-descriptor-layout-trait" }
# runtime render
truvis-render-foundation = { path = "engine/runtime/e40-render/truvis-render-foundation" }
truvis-render-graph = { path = "engine/runtime/e40-render/truvis-render-graph" }
truvis-render-runtime = { path = "engine/runtime/e40-render/truvis-render-runtime" }
# runtime world
truvis-asset = { path = "engine/runtime/e30-world/truvis-asset" }
truvis-world = { path = "engine/runtime/e30-world/truvis-world" }
# runtime render loop
truvis-render-loop = { path = "engine/runtime/e50-render-loop/truvis-render-loop" }
# runtime platform
truvis-render-thread = { path = "engine/runtime/e60-platform/truvis-render-thread" }
truvis-winit-host = { path = "engine/runtime/e60-platform/truvis-winit-host" }
# app
renderer-kit = { path = "renderer/renderer-kit" }
renderer-imgui = { path = "renderer/renderer-imgui" }
renderer-dlss = { path = "renderer/renderer-dlss" }
renderer-render-passes = { path = "renderer/renderer-render-passes" }
renderer-rendering = { path = "renderer/renderer-rendering" }
renderer-render-ui = { path = "renderer/renderer-render-ui" }
truvis-renderer-shader-binding = { path = "renderer/shader/truvis-renderer-shader-binding" }
truvis-renderer = { path = "renderer/truvis-renderer" }
truvis-scenes = { path = "app/truvis-scenes" }
truvis-editor-bridge = { path = "renderer/editor/truvis-editor-bridge" }
triangle-renderer = { path = "renderer/samples/triangle-renderer" }
shader-toy-renderer = { path = "renderer/samples/shader-toy-renderer" }
# shader
truvis-shader-binding = { path = "engine/shader/truvis-shader-binding" }
# cxx
truvis-assimp-binding = { path = "cxx/bindings/truvis-assimp-binding" }
truvis-streamline-binding = { path = "cxx/bindings/truvis-streamline-binding" }
truvis-vk-binding = { path = "cxx/bindings/truvis-vk-binding" }



###########################################################
# 图形、窗口与 GUI (Graphics, Windowing & GUI)
###########################################################
# 默认 features：
# - debug 表示 vulkan 结构体实现了 Debut Trait
# - loader 表示在运行时动态搜索 vulkan，体现在 Entry 对象的创建上
ash = { version = "0.38.0", features = ["debug"] }
# vk-mem-0.4.0 和 ash-0.38.0+1.3.281 匹配
vk-mem = "0.4.0"
glam = { version = "0.22.0", features = ["bytemuck", "rand", "serde"] }
winit = "0.30.8"
# create vk surface using window handle
ash-window = "0.13.0"
# 让 winit 可以和图形库通信
raw-window-handle = "0.6.2"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
imgui = { version = "0.12.0", features = ["docking"] }
tauri = "2.11.5"
tauri-build = "2.6.3"
tauri-plugin-dialog = "2.7.2"

###########################################################
# 资源加载与序列化 (Asset Loading & Serialization)
###########################################################
image = "0.25.6"
base64 = "0.22.1"
half = "2.7.1"
# 接受 glTF 必需的灯光扩展；当前 loader 不将其转换为场景光源。
gltf = { version = "1.0.0", features = ["KHR_lights_punctual", "KHR_materials_ior", "KHR_materials_transmission", "KHR_materials_emissive_strength", "KHR_texture_transform", "extensions"] }
tobj = "4.0.3"
serde = { version = "1.0.152", features = ["derive"] }
serde_json = "1.0.91"
ts-rs = "12.0"

###########################################################
# 日志、调试与性能分析 (Logging, Debugging & Profiling)
###########################################################
log = "0.4.0"
env_logger = "0.11.8"
colored = "2"
anstyle = "1.0.10"
anstream = "0.6.21"
tracy-client = "0.18.4"

###########################################################
# 并发与数据结构 (Concurrency & Data Structures)
###########################################################
rayon = "1.10.0"
crossbeam-channel = "0.5.15"
crossbeam-utils = "0.8"
tokio = { version = "1", features = ["macros", "net", "rt", "rt-multi-thread", "sync", "time"] }
tokio-util = "0.7"
rmcp = { version = "=3.4.0", features = ["server", "macros", "schemars", "transport-streamable-http-server"] }
axum = "0.8"
# 高性能哈希表，支持代际索引
slotmap = "1.0.7"
indexmap = "2.12.1"
uuid = { version = "1.16.0", features = ["v4"] }

###########################################################
# 开发工具 (Development Tools)
###########################################################
# 错误处理
anyhow = "1.0.84"
# 宏开发
syn = { version = "2.0", features = ["full"] }
quote = "1.0"
proc-macro2 = "1.0"
# C/C++ 绑定生成
bindgen = "0.72.1"

###########################################################
# 通用工具 (General Utilities)
###########################################################
bytemuck = { version = "1.16.0", features = ["derive"] }
itertools = "0.10.5"
enum-map = "2.7.3"
array-init = "2.1.0"
include_dir = "0.7.3"
lazy_static = "1.4.0"
walkdir = "2.5.0"
sha2 = "0.10.9"
bitflags = "2.3.2"
scopeguard = "1.2.0"
chrono = "0.4.38"
rand = "0.8.5"
rand_derive = "0.5.0"
reqwest = { version = "0.11", features = ["blocking"] }
zip = "0.6"
sevenz-rust2 = { version = "0.24.1", default-features = false, features = ["util"] }
toml = "0.8"
