[workspace]
resolver = "3"
members = [
    # e00-utils
    "engine/e00-utils/truvis-fetch-res",
    "engine/e00-utils/truvis-path",
    # e00-foundation
    "engine/e00-foundation/truvis-utils",
    "engine/e00-foundation/truvis-logs",
    # e10-gfx
    "engine/e10-gfx/truvis-gfx",
    "engine/e10-gfx/truvis-descriptor-layout-macro",
    "engine/e10-gfx/truvis-descriptor-layout-trait",
    # e40-render
    "engine/e40-render/truvis-render-foundation",
    "engine/e40-render/truvis-render-graph",
    "engine/e40-render/truvis-render-runtime",
    # e30-world
    "engine/e30-world/truvis-asset",
    "engine/e30-world/truvis-world",
    # e50-render-loop
    "engine/e50-render-loop/truvis-render-loop",
    # e60-platform
    "engine/e60-platform/truvis-render-thread",
    "engine/e60-platform/truvis-winit-host",
    # shader 绑定相关
    "engine/shader/truvis-shader-binding",
    "engine/shader/truvis-shader-binding-codegen",
    "engine/shader/truvis-shader-build",
    # cxx 绑定相关
    "engine/cxx/truvis-assimp-binding",
    "engine/cxx/truvis-streamline-binding",
    "engine/cxx/truvis-cxx-build",
    # app
    "app/app-kit",
    "app/app-imgui",
    "app/app-render-passes",
    "app/app-rendering",
    "app/app-render-ui",
    "app/shader/truvis-app-shader-binding",
    "app/editor/bridge",
    "app/truvis",
    "app/samples/hello-triangle",
    "app/samples/shader-toy",
    "app/samples/cornell",
]

[profile.dev]
opt-level = 0      # 优化级别: 0-3。0 表示不优化，编译最快
debug = true       # 包含调试符号
incremental = true # 开启增量编译，提升二次编译速度

[profile.release]
opt-level = 3      # 最高级优化，运行速度最快
debug = false      # 移除调试符号，减小二进制体积
lto = true         # 开启链接时优化 (Link Time Optimization)
panic = 'abort'    # panic 时直接终止，进一步减小体积


[workspace.dependencies]
# e00-utils
truvis-fetch-res = { path = "engine/e00-utils/truvis-fetch-res" }
truvis-path = { path = "engine/e00-utils/truvis-path" }
# e00-foundation
truvis-logs = { path = "engine/e00-foundation/truvis-logs" }
truvis-utils = { path = "engine/e00-foundation/truvis-utils" }
# e10-gfx
truvis-gfx = { path = "engine/e10-gfx/truvis-gfx" }
truvis-descriptor-layout-macro = { path = "engine/e10-gfx/truvis-descriptor-layout-macro" }
truvis-descriptor-layout-trait = { path = "engine/e10-gfx/truvis-descriptor-layout-trait" }
# e40-render
truvis-render-foundation = { path = "engine/e40-render/truvis-render-foundation" }
truvis-render-graph = { path = "engine/e40-render/truvis-render-graph" }
truvis-render-runtime = { path = "engine/e40-render/truvis-render-runtime" }
# e30-world
truvis-asset = { path = "engine/e30-world/truvis-asset" }
truvis-world = { path = "engine/e30-world/truvis-world" }
# e50-render-loop
truvis-render-loop = { path = "engine/e50-render-loop/truvis-render-loop" }
# e60-platform
truvis-render-thread = { path = "engine/e60-platform/truvis-render-thread" }
truvis-winit-host = { path = "engine/e60-platform/truvis-winit-host" }
# app
app-kit = { path = "app/app-kit" }
app-imgui = { path = "app/app-imgui" }
app-render-passes = { path = "app/app-render-passes" }
app-rendering = { path = "app/app-rendering" }
app-render-ui = { path = "app/app-render-ui" }
truvis-app-shader-binding = { path = "app/shader/truvis-app-shader-binding" }
truvis-editor-bridge = { path = "app/editor/bridge" }
# shader
truvis-shader-binding = { path = "engine/shader/truvis-shader-binding" }
truvis-shader-binding-codegen = { path = "engine/shader/truvis-shader-binding-codegen" }
truvis-shader-build = { path = "engine/shader/truvis-shader-build" }
# cxx
truvis-assimp-binding = { path = "engine/cxx/truvis-assimp-binding" }
truvis-streamline-binding = { path = "engine/cxx/truvis-streamline-binding" }
truvis-cxx-build = { path = "engine/cxx/truvis-cxx-build" }



###########################################################
# 图形、窗口与 GUI (Graphics, Windowing & GUI)
###########################################################
# 默认 features：
# - debug 表示 vulkan 结构体实现了 Debut Trait
# - loader 表示在运行时动态搜索 vulkan，体现在 Entry 对象的创建上
ash = { version = "0.38.0", features = ["debug"] }
# vk-mem-0.4.0 和 ash-0.38.0+1.3.281 匹配
vk-mem = "0.4.0"
glam = { version = "0.22.0", features = ["bytemuck", "rand", "serde"] }
winit = "0.30.8"
# create vk surface using window handle
ash-window = "0.13.0"
# 让 winit 可以和图形库通信
raw-window-handle = "0.6.2"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
imgui = { version = "0.12.0", features = ["docking"] }
tauri = "2.11.5"
tauri-build = "2.6.3"
tauri-plugin-dialog = "2.7.2"

###########################################################
# 资源加载与序列化 (Asset Loading & Serialization)
###########################################################
image = "0.25.6"
half = "2.7.1"
gltf = { version = "1.0.0", features = ["KHR_materials_ior", "KHR_materials_transmission"] }
tobj = "4.0.3"
serde = { version = "1.0.152", features = ["derive"] }
serde_json = "1.0.91"
ts-rs = "12.0"

###########################################################
# 日志、调试与性能分析 (Logging, Debugging & Profiling)
###########################################################
log = "0.4.0"
env_logger = "0.11.8"
colored = "2"
anstyle = "1.0.10"
anstream = "0.6.21"
tracy-client = "0.18.4"

###########################################################
# 并发与数据结构 (Concurrency & Data Structures)
###########################################################
rayon = "1.10.0"
crossbeam-channel = "0.5.15"
crossbeam-utils = "0.8"
tokio = { version = "1", features = ["macros", "net", "rt", "sync", "time"] }
# 高性能哈希表，支持代际索引
slotmap = "1.0.7"
indexmap = "2.12.1"
uuid = { version = "1.16.0", features = ["v4"] }

###########################################################
# 开发工具 (Development Tools)
###########################################################
# 错误处理
anyhow = "1.0.84"
# 宏开发
syn = { version = "2.0", features = ["full"] }
quote = "1.0"
proc-macro2 = "1.0"
# C/C++ 绑定生成
bindgen = "0.72.1"

###########################################################
# 通用工具 (General Utilities)
###########################################################
bytemuck = { version = "1.16.0", features = ["derive"] }
itertools = "0.10.5"
enum-map = "2.7.3"
array-init = "2.1.0"
include_dir = "0.7.3"
lazy_static = "1.4.0"
walkdir = "2.5.0"
bitflags = "2.3.2"
scopeguard = "1.2.0"
chrono = "0.4.38"
rand = "0.8.5"
rand_derive = "0.5.0"
reqwest = { version = "0.11", features = ["blocking"] }
zip = "0.6"
toml = "0.8"
