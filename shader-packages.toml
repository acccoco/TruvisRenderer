[compiler]
slangc = "external/slang/bin/slangc.exe"
glslc = "glslc"
dxc = "dxc"

[[package]]
id = "engine"
entry_root = "engine/shader/entry"
include_roots = ["engine/shader"]
shared_inputs = [
    { path = "engine/shader/abi/engine", layer = "abi" },
    { path = "engine/shader/lib/engine", layer = "lib" },
]
depends_on = []
output_prefix = "engine"

[[package]]
id = "renderer"
entry_root = "renderer/shader/entry/renderer"
include_roots = ["engine/shader", "renderer/shader"]
shared_inputs = [
    { path = "renderer/shader/abi/renderer", layer = "abi" },
    { path = "renderer/shader/lib/renderer", layer = "lib" },
]
depends_on = ["engine"]
output_prefix = "renderer"

[[package]]
id = "sample-hello-triangle"
entry_root = "renderer/shader/entry/sample-hello-triangle"
include_roots = ["engine/shader"]
shared_inputs = []
depends_on = ["engine"]
output_prefix = "samples/hello-triangle"

[[package]]
id = "sample-shader-toy"
entry_root = "renderer/shader/entry/sample-shader-toy"
include_roots = ["renderer/shader"]
shared_inputs = [
    { path = "renderer/shader/lib/sample-shader-toy", layer = "lib" },
]
depends_on = []
output_prefix = "samples/shader-toy"

[[binding]]
id = "engine"
package = "engine"
header = "engine/shader/truvis-shader-binding/ffi/rust_ffi.hpp"
extra_include_roots = []
output_crate = "truvis-shader-binding"

[[binding]]
id = "renderer"
package = "renderer"
header = "renderer/shader/truvis-renderer-shader-binding/ffi/rust_ffi.hpp"
extra_include_roots = ["engine/shader/truvis-shader-binding/ffi"]
output_crate = "truvis-renderer-shader-binding"
